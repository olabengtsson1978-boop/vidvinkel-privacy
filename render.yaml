# Publicering på Render (render.com): New → Blueprint → välj det här repot.
services:
  - type: web
    name: phpkollen
    runtime: node
    rootDir: php-check
    plan: starter
    region: frankfurt
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
    domains:
      - phpkollen.se
      - www.phpkollen.se
